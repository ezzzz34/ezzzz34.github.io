<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>모바일 청첩장</title>

  <!-- 카카오톡/문자 공유 시 보이는 미리보기 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="소규성 ♥ 김은주 결혼합니다" />
  <meta property="og:description" content="2026년 12월 13일 일요일 오전 11시 30분, 신도림 더세인트 6층 그랜드볼룸 홀" />
  <meta property="og:image" content="assets/img/main.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <!-- =====================================================================
       페이지는 config.js 의 내용으로 자동으로 채워집니다.
       구조(순서·섹션 추가/삭제)를 바꾸고 싶을 때만 이 파일을 수정하세요.
       ===================================================================== -->
  <main class="paper">

    <!-- ① 커버 : 편지 봉투에서 사진이 나오는 화면 -->
    <section class="cover" id="cover">
      <!-- 배경음악 켜기/끄기 (기본: 켜짐) -->
      <button class="music-btn is-on" type="button" data-slot="music" aria-pressed="true" aria-label="배경음악 끄기">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M9 18V5l10-2v13" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="6.5" cy="18" r="2.6" fill="currentColor" />
          <circle cx="16.5" cy="16" r="2.6" fill="currentColor" />
          <path class="music-btn__slash" d="M3 3 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span class="music-btn__label">ON</span>
      </button>

      <h1 class="cover__title">
        <span data-bind="cover.titleTop"></span>
        <span>
          <span data-bind="couple.groom.nameEn"></span>
          <span class="cover__amp">&amp;</span>
          <span data-bind="couple.bride.nameEn"></span>
        </span>
      </h1>

      <!-- 봉투 : 겹치는 순서 (뒤 → 앞)
             뒷판 → 사진 → 앞판 → 덮개(닫힌 상태)
           접속하면 main.js 가 is-opening 을 붙여 [흔들림 → 덮개 열림 → 사진 튀어나옴] 순서로 재생합니다.
           처음 상태(is-closed)는 사진이 봉투 속에 들어가 있고 덮개가 닫혀 있습니다. -->
      <div class="envelope is-closed" data-slot="envelope">
        <!-- 봉투 뒷판(안쪽 면) -->
        <svg class="envelope__back" viewBox="0 0 688 418" aria-hidden="true" focusable="false">
          <rect width="688" height="418" rx="10" />
        </svg>

        <!-- 사진 : 봉투 바닥선 아래로는 잘려서 보이지 않습니다 -->
        <div class="envelope__pocket">
          <div class="envelope__photo">
            <div class="envelope__frame">
              <img data-bind-src="cover.image" alt="메인 사진" />
              <!-- 사진 안에서만 내리는 눈 -->
              <canvas class="snow" data-slot="snow" aria-hidden="true"></canvas>
            </div>
          </div>
        </div>

        <!-- 봉투 앞판 (가운데가 V자로 파여 사진이 그 사이로 올라옵니다) -->
        <svg class="envelope__front" viewBox="0 0 688 418" aria-hidden="true" focusable="false">
          <defs>
            <clipPath id="envClip">
              <path d="M0,10 Q0,0 10,0 L344,202 L678,0 Q688,0 688,10 L688,408
                       Q688,418 678,418 L10,418 Q0,418 0,408 Z" />
            </clipPath>
          </defs>
          <path class="envelope__paper"
                d="M0,10 Q0,0 10,0 L344,202 L678,0 Q688,0 688,10 L688,408
                   Q688,418 678,418 L10,418 Q0,418 0,408 Z" />
          <g clip-path="url(#envClip)">
            <path class="envelope__fold" d="M344,121 L0,382 M344,121 L688,382" />
          </g>
        </svg>

        <!-- 봉투 덮개 -->
        <div class="envelope__flap">
          <svg viewBox="0 0 688 262" aria-hidden="true" focusable="false">
            <path class="envelope__flap-paper"
                  d="M0,10 Q0,0 10,0 L678,0 Q688,0 688,10 L356,252 Q344,261 332,252 Z" />
          </svg>
        </div>

      </div>

      <p class="cover__subtitle" data-bind="cover.subtitle"></p>

      <a class="cover__more" href="#greeting">
        <span data-bind="cover.moreLabel"></span>
        <svg viewBox="0 0 24 14" width="30" height="18" aria-hidden="true">
          <path d="M2 2 L12 11 L22 2" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </section>

    <!-- ② 인사말 -->
    <section class="section reveal" id="greeting">
      <p class="section__eyebrow">INVITATION</p>
      <h2 class="section__title" data-bind="greeting.title"></h2>
      <p class="greeting__poem" data-bind="greeting.poem"></p>
      <div class="divider" aria-hidden="true"></div>
      <p class="greeting__body" data-bind="greeting.body"></p>

      <!-- 혼주 / 신랑신부 : 2열 격자(혼주 | 이름) 로 두 줄의 열을 정확히 맞춥니다 -->
      <div class="parents">
        <p class="parents__who"><span data-parent="couple.groom.father"></span><span class="parents__dot">·</span><span data-parent="couple.groom.mother"></span><span class="parents__rel">의 <span data-bind="couple.groom.relation"></span></span></p>
        <p class="parents__name" data-bind="couple.groom.name"></p>

        <p class="parents__who"><span data-parent="couple.bride.father"></span><span class="parents__dot">·</span><span data-parent="couple.bride.mother"></span><span class="parents__rel">의 <span data-bind="couple.bride.relation"></span></span></p>
        <p class="parents__name" data-bind="couple.bride.name"></p>
      </div>
    </section>

    <!-- ③ 예식 일시 -->
    <section class="section reveal" id="calendar">
      <p class="section__eyebrow">WEDDING DAY</p>
      <h2 class="section__title" data-slot="wedding-date"></h2>
      <p class="section__lead" data-slot="wedding-time"></p>
      <div class="calendar" data-slot="calendar"></div>
      <p class="dday" data-slot="dday"></p>
    </section>

    <!-- ④ 갤러리 -->
    <section class="section reveal" id="gallery">
      <p class="section__eyebrow" data-bind="gallery.title"></p>
      <h2 class="section__title">우리의 순간</h2>
      <div class="gallery-grid" data-slot="gallery"></div>
    </section>

    <!-- ⑤ 장소 -->
    <section class="section reveal" id="location">
      <p class="section__eyebrow">LOCATION</p>
      <h2 class="section__title" data-bind="wedding.venue.name"></h2>
      <p class="section__lead" data-bind="wedding.venue.hall"></p>
      <p class="venue__address" data-bind="wedding.venue.address"></p>
      <div class="btn-row">
        <button class="btn" type="button" data-action="copy-address">주소 복사</button>
        <a class="btn" data-bind-href="tel:wedding.venue.tel">웨딩홀 전화</a>
      </div>

      <!-- 지도 (config 의 wedding.venue.mapQuery 로 검색한 위치) -->
      <div class="map" data-slot="map"></div>
      <!-- 지도 앱으로 열기 -->
      <div class="map-apps" data-slot="map-apps"></div>

      <!-- 오시는 길 (config 의 wedding.directions) -->
      <div class="directions" data-slot="directions"></div>
    </section>

    <!-- ⑥ 연락처 -->
    <section class="section reveal" id="contact">
      <p class="section__eyebrow">CONTACT</p>
      <h2 class="section__title" data-bind="contact.title"></h2>
      <p class="section__lead" data-bind="contact.description"></p>
      <div class="contact-list" data-slot="contact"></div>
    </section>

    <!-- ⑦ 푸터 -->
    <footer class="footer reveal">
      <div class="btn-row" data-slot="share"></div>
      <p class="footer__text" data-bind="options.footerText"></p>
    </footer>
  </main>

  <!-- 갤러리 라이트박스 -->
  <div class="lightbox" data-slot="lightbox" hidden>
    <div class="lightbox__stage">
      <img class="lightbox__img" src="" alt="" />
      <!-- 사진 오른쪽 위 X -->
      <button class="lightbox__close" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </div>
    <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="이전 사진">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="다음 사진">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
    </button>
    <p class="lightbox__count"></p>
  </div>

  <!-- 토스트 -->
  <div class="toast" data-slot="toast" hidden></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
